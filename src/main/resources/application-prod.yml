spring:
  config:
    activate:
      on-profile: prod

# Dokumentasi API tidak dipublikasikan di produksi.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.fastwork.expense: INFO
    org.springframework.security: WARN
